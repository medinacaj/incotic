name: INCOTIC navegador real — responsive y accesibilidad funcional
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'servicios/**'
      - 'servicios.css'
      - 'tests/browser-smoke.py'
      - '.github/workflows/browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegador de test (sin terceros en ejecución de la web)
        run: |
          python -m pip install "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - name: Probar sitio local y sus siete rutas
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/incotic-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          python tests/browser-smoke.py
